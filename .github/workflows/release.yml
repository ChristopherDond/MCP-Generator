name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const assert = require("node:assert/strict"); const p = require("./package.json"); assert.equal(p.name, "@christopher_dondici/mcp-gen"); assert.equal(process.env.RELEASE_TAG, "v" + p.version); assert.equal(p.publishConfig.access, "public");'

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Smoke test installed tarball
        run: |
          npm install --prefix "$RUNNER_TEMP/mcp-gen-smoke" "$RUNNER_TEMP/christopher_dondici-mcp-gen-"*.tgz --no-audit --no-fund
          "$RUNNER_TEMP/mcp-gen-smoke/node_modules/.bin/mcp-gen" --version
          "$RUNNER_TEMP/mcp-gen-smoke/node_modules/.bin/mcp-gen" validate -i "$RUNNER_TEMP/mcp-gen-smoke/node_modules/@christopher_dondici/mcp-gen/examples/petstore.yaml"

      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish "$RUNNER_TEMP/christopher_dondici-mcp-gen-"*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ runner.temp }}/christopher_dondici-mcp-gen-*.tgz
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
