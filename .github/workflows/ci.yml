name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Smoke test installed tarball
        run: |
          npm install --prefix "$RUNNER_TEMP/mcp-gen-smoke" "$RUNNER_TEMP/mcp-gen-"*.tgz --no-audit --no-fund
          "$RUNNER_TEMP/mcp-gen-smoke/node_modules/.bin/mcp-gen" --version
          "$RUNNER_TEMP/mcp-gen-smoke/node_modules/.bin/mcp-gen" validate -i "$RUNNER_TEMP/mcp-gen-smoke/node_modules/mcp-gen/examples/petstore.yaml"
