name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Test CLI exit codes
        run: npm run test:cli

      - name: Build and smoke test generated TypeScript
        timeout-minutes: 6
        run: npm run test:generated

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and smoke test generated Python
        timeout-minutes: 6
        run: npm run test:generated:py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build and smoke test generated Go
        timeout-minutes: 6
        run: npm run test:generated:go

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
        shell: bash

      - name: Smoke test installed tarball
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mcp-gen-smoke" "$RUNNER_TEMP/christopher_dondici-mcp-gen-"*.tgz --no-audit --no-fund
          "$RUNNER_TEMP/mcp-gen-smoke/node_modules/.bin/mcp-gen" --version
          "$RUNNER_TEMP/mcp-gen-smoke/node_modules/.bin/mcp-gen" validate -i "$RUNNER_TEMP/mcp-gen-smoke/node_modules/@christopher_dondici/mcp-gen/examples/petstore.yaml"
